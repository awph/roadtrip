name: Deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Scoped per ref: this repository keeps main and the working branch in
  # sync, and a shared group let a push to one cancel the in-flight run of
  # the other — including the run that was actually going to deploy.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Publish from whatever the repository's default branch is called.
    # This is not just convention: the github-pages environment only accepts
    # deployments from the default branch, so any other value here fails the
    # deploy job after a green build. Point Settings → Branches at main and
    # this follows automatically.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        # A project site is served from /<repo>/, so the base path must match.
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" node build.mjs

      - name: Check that no visible string is in English
        run: node scripts/check-langue.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
